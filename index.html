        function renderList() {
            const search = document.getElementById('searchBox').value.toLowerCase();
            const sortValue = document.getElementById('sortDropdown').value;
            
            console.log('검색:', search, '정렬:', sortValue);
            
            let filtered = coffees.filter(c =>
                c.name.toLowerCase().includes(search) || c.origin.toLowerCase().includes(search)
            );

            console.log('필터링 후:', filtered.length, '개');

            // 정렬 적용
            switch(sortValue) {
                case 'default':
                    // 기본값: 구매 날짜 최신순
                    filtered.sort((a, b) => {
                        if (!a.date && !b.date) return b.id - a.id; // 둘 다 날짜 없으면 최근 등록순
                        if (!a.date) return -1; // a 날짜 없으면 위로
                        if (!b.date) return 1;  // b 날짜 없으면 위로
                        return new Date(b.date) - new Date(a.date);
                    });
                    console.log('구매날짜 최신순 정렬 완료 (기본)');
                    break;
                case 'origin':
                    filtered.sort((a, b) => (a.origin || '').localeCompare(b.origin || ''));
                    console.log('원산지별 정렬 완료');
                    break;
                case 'variety':
                    filtered.sort((a, b) => (a.variety || '').localeCompare(b.variety || ''));
                    console.log('품종별 정렬 완료');
                    break;
                case 'process':
                    filtered.sort((a, b) => (a.process || '').localeCompare(b.process || ''));
                    console.log('처리 방식별 정렬 완료');
                    break;
                case 'roast':
                    filtered.sort((a, b) => (a.roast || 0) - (b.roast || 0));
                    console.log('로스트별 정렬 완료');
                    break;
                case 'date-desc':
                    filtered.sort((a, b) => {
                        if (!a.date && !b.date) return b.id - a.id;
                        if (!a.date) return -1;
                        if (!b.date) return 1;
                        return new Date(b.date) - new Date(a.date);
                    });
                    console.log('구매날짜 최신순 정렬 완료');
                    break;
                case 'date-asc':
                    filtered.sort((a, b) => {
                        if (!a.date && !b.date) return a.id - b.id;
                        if (!a.date) return 1;  // 오래된순에서 날짜 없으면 맨 아래
                        if (!b.date) return -1;
                        return new Date(a.date) - new Date(b.date);
                    });
                    console.log('구매날짜 오래된순 정렬 완료');
                    break;
                case 'price-desc':
                    filtered.sort((a, b) => {
                        const pA = parseInt((a.price || '0').replace(/[^0-9]/g, '')) || 0;
                        const pB = parseInt((b.price || '0').replace(/[^0-9]/g, '')) || 0;
                        return pB - pA;
                    });
                    console.log('가격 비싼순 정렬 완료');
                    break;
                case 'price-asc':
                    filtered.sort((a, b) => {
                        const pA = parseInt((a.price || '0').replace(/[^0-9]/g, '')) || 0;
                        const pB = parseInt((b.price || '0').replace(/[^0-9]/g, '')) || 0;
                        return pA - pB;
                    });
                    console.log('가격 싼순 정렬 완료');
                    break;
            }

            const list = document.getElementById('coffeeList');

            if (filtered.length === 0) {
                list.innerHTML = '';
                document.getElementById('emptyMsg').style.display = 'block';
                return;
            }

            document.getElementById('emptyMsg').style.display = 'none';
            list.innerHTML = filtered.map(c => `
                <div class="coffee-card" onclick="showDetail(${c.id})" style="cursor: pointer; transition: all 0.2s;" onmouseover="this.style.boxShadow='0 4px 8px rgba(0,0,0,0.15)'" onmouseout="this.style.boxShadow='0 2px 4px rgba(0,0,0,0.08)'">
                    ${c.image ? `<img src="${c.image}" style="cursor: pointer;" />` : `<div style="background: #f0f0f0; height: 100px; display: flex; align-items: center; justify-content: center; font-size: 40px; color: #ddd; border-radius: 6px; margin-bottom: 8px;">📷</div>`}
                    <div class="coffee-name">${c.name}</div>
                    <div class="coffee-date">${c.date || '날짜 미입력'}</div>
                    <div class="coffee-info">
                        <div class="info-row"><div class="info-label">원산지:</div><div>${c.origin}</div></div>
                        ${c.variety ? `<div class="info-row"><div class="info-label">품종:</div><div>${c.variety}</div></div>` : ''}
                        ${c.altitude ? `<div class="info-row"><div class="info-label">해발:</div><div>${c.altitude}</div></div>` : ''}
                        ${c.roast ? `<div class="info-row"><div class="info-label">로스트:</div><div>${Array.from({length:5},(_,i)=>`<span style="display:inline-block;width:12px;height:12px;border-radius:2px;background:${i<parseInt(c.roast)?'#6F4E37':'#e0d0c0'};margin-right:3px;"></span>`).join('')}</div></div>` : ''}
                    </div>
                    <div style="display: flex; gap: 8px; margin-top: 10px;">
                        <button type="button" onclick="event.stopPropagation(); editCoffee(${c.id})" style="flex: 1; padding: 10px; background: #2196F3; color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;">✏️ 수정</button>
                        <button type="button" onclick="event.stopPropagation(); deleteCoffee(${c.id})" style="flex: 1; padding: 10px; background: #f44336; color: white; border: none; border-radius: 6px; font-size: 12px; font-weight: 600; cursor: pointer;">🗑️ 삭제</button>
                    </div>
                </div>
            `).join('');
        }

        function editCoffee(id) {
            const coffee = coffees.find(c => c.id === id);
            if (!coffee) return;

            // 수정 폼에 데이터 입력
            document.getElementById('coffeeName').value = coffee.name;
            document.getElementById('origin').value = coffee.origin;
            document.getElementById('variety').value = coffee.variety || '';
            document.getElementById('altitude').value = coffee.altitude || '';
            document.getElementById('process').value = coffee.process || '';
            document.getElementById('notes').value = coffee.notes || '';
            document.getElementById('purchaseDate').value = coffee.date;
            document.getElementById('price').value = coffee.price || '';
            document.getElementById('memo').value = coffee.memo || '';
            
            if (coffee.roast) {
                document.querySelectorAll('.roast-btn').forEach(b => {
                    b.classList.remove('selected');
                    if (b.dataset.roast === coffee.roast) {
                        b.classList.add('selected');
                    }
                });
                selectedRoast = coffee.roast;
            }

            if (coffee.image) {
                currentImage = coffee.image;
                document.getElementById('previewImg').src = currentImage;
                document.getElementById('imagePreview').style.display = 'block';
            }

            // 폼 제출 시 수정 모드
            const form = document.getElementById('coffeeForm');
            form.onsubmit = (e) => updateCoffee(e, id);
            
            // 버튼 텍스트 변경
            form.querySelector('button[type="submit"]').textContent = '✓ 수정 완료';
            
            // 추가 탭으로 이동
            switchTab(0);
            
            alert('수정할 정보를 변경하고 "수정 완료"를 클릭하세요');
        }

        function updateCoffee(e, id) {
            e.preventDefault();

            const name = document.getElementById('coffeeName').value.trim();
            const origin = document.getElementById('origin').value.trim();

            if (!name || !origin) {
                alert('커피 이름과 원산지는 필수입니다');
                return;
            }

            const coffeeIndex = coffees.findIndex(c => c.id === id);
            if (coffeeIndex === -1) return;

            coffees[coffeeIndex] = {
                id,
                name, origin,
                variety: document.getElementById('variety').value.trim(),
                altitude: document.getElementById('altitude').value.trim(),
                process: document.getElementById('process').value.trim(),
                notes: document.getElementById('notes').value.trim(),
                roast: selectedRoast,
                date: document.getElementById('purchaseDate').value,
                price: document.getElementById('price').value.trim(),
                memo: document.getElementById('memo').value.trim(),
                image: currentImage
            };

            saveCoffees();
            
            // 폼 초기화 및 복원
            document.getElementById('coffeeForm').reset();
            document.getElementById('coffeeForm').onsubmit = addCoffee;
            document.querySelector('#coffeeForm button[type="submit"]').textContent = '✓ 커피 추가';
            clearImage();
            selectedRoast = 0;
            document.querySelectorAll('.roast-btn').forEach(b => b.classList.remove('selected'));
            
            alert('✓ 커피 정보가 수정되었습니다!');
            switchTab(1);
            renderList();
        }

        function deleteCoffee(id) {
            if (confirm('삭제하시겠습니까?')) {
                coffees = coffees.filter(c => c.id !== id);
                saveCoffees();
                renderList();
            }
        }

        function saveCoffees() {
            const forSave = coffees.map(c => {
                const copy = {...c};
                delete copy.image;
                return copy;
            });
            localStorage.setItem('coffees', JSON.stringify(forSave));
        }

        function loadCoffees() {
            const saved = localStorage.getItem('coffees');
            coffees = saved ? JSON.parse(saved) : [];

            // ── 날짜 복구: 마이그레이션 오작동으로 변조된 날짜 원복 ────────
            // 변조 특징: 연도가 현재보다 2년 이상 미래 → sy↔dy 역교환으로 복구
            const todayY = new Date().getFullYear();
            let recovered = false;
            coffees.forEach(c => {
                if (!c.date) return;
                const m = c.date.match(/^(20(\d{2}))-(\d{2})-(\d{2})$/);
                if (!m) return;
                const [, fullYear, shortYear, month, day] = m;
                const yr = parseInt(fullYear);
                const sy = parseInt(shortYear);
                const dy = parseInt(day);
                // 2년 이상 미래 날짜이고, 역교환하면 과거 날짜가 되는 경우
                if (yr - todayY >= 2) {
                    const restored = `20${String(dy).padStart(2,'0')}-${month}-${String(sy).padStart(2,'0')}`;
                    const restoredYr = parseInt(restored.slice(0,4));
                    if (restoredYr <= todayY) {
                        console.log(`날짜 복구: ${c.date} → ${restored} (${c.name})`);
                        c.date = restored;
                        recovered = true;
                    }
                }
            });
            if (recovered) {
                saveCoffees();
                console.log('날짜 복구 완료');
            }
            // ─────────────────────────────────────────────────────────

            renderList();
        }

        function exportCSV() {
            // 헤더 (더 많은 정보 포함)
            let csv = '커피명,원산지,품종,해발고도(m),처리방식,맛노트,로스트(1-5),구매날짜,가격,메모\n';
            
            coffees.forEach(c => {
                // CSV 형식에서 쉼표와 따옴표 처리
                const escapeCsv = (str) => {
                    if (!str) return '""';
                    str = str.toString().replace(/\r?\n/g, ' '); // 줄바꿈 → 공백 (CSV 파싱 보호)
                    return `"${str.replace(/"/g, '""')}"`; // 모든 필드 따옴표로 감쌈
                };
                
                csv += `${escapeCsv(c.name)},${escapeCsv(c.origin)},${escapeCsv(c.variety)},${escapeCsv(c.altitude)},${escapeCsv(c.process)},${escapeCsv(c.notes)},${escapeCsv(c.roast)},${escapeCsv(c.date)},${escapeCsv(c.price)},${escapeCsv(c.memo)}\n`;
            });
            
            // 현재 날짜로 파일명 생성
            const today = new Date().toISOString().split('T')[0];
            downloadFile(csv, `커피데이터_${today}.csv`, 'text/csv;charset=utf-8');
        }

        function exportJSON() {
            const forSave = coffees.map(c => {
                const copy = {...c};
                delete copy.image; // 이미지는 제외 (용량 절감)
                return copy;
            });
            
            // 현재 날짜로 파일명 생성
            const today = new Date().toISOString().split('T')[0];
            downloadFile(JSON.stringify(forSave, null, 2), `커피데이터_${today}.json`, 'application/json;charset=utf-8');
        }

        function importData() {
            const fileInput = document.getElementById('importFile');
            const msg = document.getElementById('importMessage');
            
            console.log('importData 호출됨');
            console.log('파일 입력 요소:', fileInput);
            console.log('파일 개수:', fileInput.files.length);
            
            if (!fileInput.files.length) {
                msg.textContent = '⚠️ 파일을 선택하세요';
                msg.style.color = '#ff9800';
                console.log('파일이 선택되지 않음');
                return;
            }

            const file = fileInput.files[0];
            console.log('선택된 파일:', file.name, file.size, 'bytes');
            
            const reader = new FileReader();
            
            reader.onerror = function() {
                msg.textContent = '❌ 파일 읽기 오류';
                msg.style.color = '#f44336';
                console.error('파일 읽기 실패:', reader.error);
            };

            reader.onload = function(e) {
                try {
                    console.log('파일 읽기 완료, 크기:', e.target.result.length);
                    
                    let importedData = [];

                    if (file.name.endsWith('.csv')) {
                        console.log('CSV 파일 처리 중...');
                        // CSV 파싱 - 따옴표 안의 줄바꿈까지 처리하는 RFC 4180 완전 분리
                        const csvText = e.target.result;
                        const lines = splitCSVLines(csvText);
                        
                        console.log('총 라인 수:', lines.length);
                        
                        // 헤더 파싱
                        const headerLine = lines[0];
                        const headers = parseCSVLine(headerLine);
                        
                        console.log('CSV 헤더:', headers);
                        
                        // 데이터 행 파싱
                        for (let i = 1; i < lines.length; i++) {
                            const values = parseCSVLine(lines[i]);
                            
                            if (values.length > 0 && values[0]) { // 최소 이름 필요
                                // 헤더 기준으로 데이터 매핑
                                const rowData = {};
                                headers.forEach((header, idx) => {
                                    rowData[header] = values[idx] || '';
                                });
                                
                                // 로스트 값 파싱 (숫자 또는 텍스트 모두 처리)
                                let roastValue = rowData['로스트(1-5)'] || rowData['로스트'] || rowData['Roast'] || '0';
                                roastValue = roastValue.toString().trim();
                                const roastTextMap = {
                                    'light': 1, '라이트': 1,
                                    'medium light': 2, 'medium-light': 2, 'ml': 2, '미디엄 라이트': 2,
                                    'medium': 3, '미디엄': 3, '미디움': 3,
                                    'medium dark': 4, 'medium-dark': 4, 'md': 4, '미디엄 다크': 4,
                                    'dark': 5, '다크': 5, 'french': 5, '프렌치': 5
                                };
                                roastValue = parseInt(roastValue) || roastTextMap[roastValue.toLowerCase()] || 0;
                                
                                console.log('로스트 원본:', rowData['로스트(1-5)'], '파싱됨:', roastValue);
                                
                                const coffeeItem = {
                                    id: Date.now() + Math.random(),
                                    name: rowData['커피명'] || rowData['Coffee Name'] || '',
                                    origin: rowData['원산지'] || rowData['Origin'] || '',
                                    variety: rowData['품종'] || rowData['Variety'] || '',
                                    altitude: rowData['해발고도(m)'] || rowData['해발고도'] || rowData['Altitude'] || '',
                                    process: rowData['처리방식'] || rowData['Process'] || '',
                                    notes: rowData['맛노트'] || rowData['Taste Notes'] || '',
                                    roast: roastValue,
                                    date: rowData['구매날짜'] || rowData['Purchase Date'] || new Date().toISOString().split('T')[0],
                                    price: rowData['가격'] || rowData['Price'] || '',
                                    memo: rowData['메모'] || rowData['기타메모'] || rowData['Memo'] || rowData['memo'] || '',
                                    image: ''
                                };
                                
                                console.log('파싱된 행 ' + (i-1) + ':', coffeeItem.name, 'roast=' + coffeeItem.roast);
                                importedData.push(coffeeItem);
                            }
                        }
                    } else if (file.name.endsWith('.json')) {
                        console.log('JSON 파일 처리 중...');
                        // JSON 파싱
                        importedData = JSON.parse(e.target.result);
                        
                        console.log('파싱된 JSON 항목 수:', importedData.length);
                        
                        // 각 항목에 기본값 설정
                        importedData = importedData.map(item => ({
                            id: item.id || (Date.now() + Math.random()),
                            name: item.name || '',
                            origin: item.origin || '',
                            variety: item.variety || '',
                            altitude: item.altitude || '',
                            process: item.process || '',
                            notes: item.notes || '',
                            roast: item.roast || 0,
                            date: item.date || new Date().toISOString().split('T')[0],
                            price: item.price || '',
                            memo: item.memo || '',
                            image: item.image || ''
                        }));
                    } else {
                        msg.textContent = '⚠️ CSV 또는 JSON 파일만 가능합니다';
                        msg.style.color = '#f44336';
                        return;
                    }

                    if (importedData.length === 0) {
                        msg.textContent = '⚠️ 유효한 데이터가 없습니다';
                        msg.style.color = '#f44336';
                        return;
                    }

                    console.log('가져올 데이터:', importedData);

                    // 중복 제거하고 추가
                    let addedCount = 0;
                    let duplicateCount = 0;

                    importedData.forEach(newCoffee => {
                        const existingIdx = coffees.findIndex(c =>
                            c.name.toLowerCase() === newCoffee.name.toLowerCase() &&
                            c.origin.toLowerCase() === newCoffee.origin.toLowerCase() &&
                            c.date === newCoffee.date
                        );

                        if (existingIdx === -1) {
                            coffees.push(newCoffee);
                            addedCount++;
                        } else {
                            // 기존 항목을 새 데이터로 업데이트 (이미지는 기존 것 유지)
                            coffees[existingIdx] = {
                                ...coffees[existingIdx],
                                ...newCoffee,
                                image: coffees[existingIdx].image || newCoffee.image
                            };
                            duplicateCount++;
                        }
                    });

                    console.log('추가된 데이터:', addedCount, '중복:', duplicateCount);

                    saveCoffees();
                    renderList();
                    
                    let message = `✓ ${addedCount}개의 커피가 추가되었습니다`;
                    if (duplicateCount > 0) {
                        message += ` (${duplicateCount}개 업데이트됨)`;
                    }
                    msg.textContent = message;
                    msg.style.color = '#4CAF50';
                    
                    console.log('데이터 저장 완료');
                    
                    // 파일 입력 초기화
                    fileInput.value = '';
                    document.getElementById('fileName').style.display = 'none';
                    
                    // 목록 탭으로 자동 전환
                    setTimeout(() => switchTab(1), 500);
                } catch (error) {
                    console.error('오류:', error);
                    msg.textContent = '❌ 파일 처리 오류: ' + error.message;
                    msg.style.color = '#f44336';
                }
            };

            console.log('파일 읽기 시작...');
            reader.readAsText(file);
        }

        // CSV 라인 파싱 함수 (따옴표 처리)
        function splitCSVLines(text) {
            // 따옴표 안의 \n을 무시하고 레코드 단위로 분리 (RFC 4180)
            const records = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < text.length; i++) {
                const ch = text[i];
                if (ch === '"') {
                    inQuotes = !inQuotes;
                    current += ch;
                } else if ((ch === '\n' || (ch === '\r' && text[i+1] === '\n')) && !inQuotes) {
                    if (ch === '\r') i++; // \r\n 건너뜀
                    if (current.trim()) records.push(current);
                    current = '';
                } else {
                    current += ch;
                }
            }
            if (current.trim()) records.push(current);
            return records;
        }

        function parseCSVLine(line) {
            // RFC 4180 준수 파서 - 따옴표 안의 쉼표 완전 처리
            const result = [];
            let i = 0;
            while (i < line.length) {
                if (line[i] === '"') {
                    let field = '';
                    i++; // 여는 따옴표 스킵
                    while (i < line.length) {
                        if (line[i] === '"') {
                            if (line[i + 1] === '"') { field += '"'; i += 2; } // "" → "
                            else { i++; break; } // 닫는 따옴표
                        } else { field += line[i++]; }
                    }
                    result.push(field);
                    if (line[i] === ',') i++; // 구분자 스킵
                } else {
                    let start = i;
                    while (i < line.length && line[i] !== ',') i++;
                    result.push(line.slice(start, i).trim());
                    if (line[i] === ',') i++;
                }
            }
            if (line.endsWith(',')) result.push(''); // 마지막 빈 필드
            return result;
        }

        function downloadFile(data, name, type) {
            const blob = new Blob([data], { type });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = name;
            link.click();
            URL.revokeObjectURL(url);
        }

        function clearAllData() {
            if (confirm('정말 모든 데이터를 삭제하시겠습니까?')) {
                coffees = [];
                saveCoffees();
                renderList();
                alert('✓ 모든 데이터가 삭제되었습니다');
            }
        }
    </script>
